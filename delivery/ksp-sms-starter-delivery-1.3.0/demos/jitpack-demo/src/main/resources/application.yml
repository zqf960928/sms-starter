server:
  port: 18084

spring:
  application:
    name: javajitpacksms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.0.130:3307/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: SMS{mysql-sh:username}
    password: SMS{mysql-sh:password}

ksp:
  sms:
    url: ${KSP_SMS_URL:https://192.168.0.130:8390}
    domain: ${KSP_SMS_DOMAIN:1}
    appKey: ${KSP_SMS_APP_KEY:admin}
    appSecret: ${KSP_SMS_APP_SECRET:9d0022b3e66c87b066890baba1d481954a8b9c5ad3fa12de04596600c7acb5da}
    version: ${KSP_SMS_VERSION:2}
    enabled: true
    cipherPrefix: SMS{
    jsonKey: value
    refresh:
      enabled: true
      intervalSeconds: 10
      leadTimeSeconds: 300
      refreshStatic: true
      datasourceEnabled: false
      hikariEnabled: false
      validateOnRotate: false
      validationQuery: "SELECT 1"
      evictDelayMs: 0
      lifecycleDriven: true
      renewTtlSeconds: ${KSP_SMS_RENEW_TTL:3600}
      maxRenewFailures: 2

app:
  demo:
    dbUserMirror: SMS{mysql-sh:username}
    dbPassMirror: SMS{mysql-sh:password}
    tableName: ksp_config
    business:
      initialDelayMs: 3000
      monitorIntervalMs: 5000
      retireDelayMs: 30000

logging:
  level:
    com.andang: debug
    com.andang.starter: debug
